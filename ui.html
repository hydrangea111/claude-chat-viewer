<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Claude Code 대화 뷰어</title>
<style>
:root{
  --bg:#f6f5f2;--panel:#ffffff;--side:#efede8;--line:#e3e0d9;--text:#1f1d1a;--dim:#7a766d;
  --accent:#c8643c;--accent-ink:#fff;--user:#c8643c;--chip:#f1efe9;--code:#f4f2ed;
  --ok:#2f9e63;--err:#d44a4a;--warn:#c78a1d;--add:#e3f5e8;--del:#fbe6e6;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1115;--panel:#171a20;--side:#13161b;--line:#262a33;--text:#e8e6e1;--dim:#8b8f99;
  --accent:#e0805a;--chip:#1e222a;--code:#11141a;--add:#12301f;--del:#3a1a1c;--shadow:0 1px 2px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --bg:#0f1115;--panel:#171a20;--side:#13161b;--line:#262a33;--text:#e8e6e1;--dim:#8b8f99;
  --accent:#e0805a;--chip:#1e222a;--code:#11141a;--add:#12301f;--del:#3a1a1c;--shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.6 "Segoe UI Variable Text","Segoe UI","Malgun Gothic",sans-serif;display:flex;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--dim);background-clip:padding-box;border:2px solid transparent}

/* sidebar */
aside{width:316px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0}
.brand{padding:20px 20px 12px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:-.2px}
.ver{margin-left:auto;font-size:11px;font-weight:600;color:var(--dim);background:var(--chip);border-radius:20px;padding:1px 8px}
.logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#e9a46f);display:grid;place-items:center;color:#fff;font-size:14px}
.search{margin:0 16px 10px;position:relative}
.search input{width:100%;padding:9px 12px 9px 34px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;outline:none}
.search input:focus{border-color:var(--accent)}
.search svg{position:absolute;left:11px;top:11px;width:15px;height:15px;stroke:var(--dim);fill:none;stroke-width:2}
#sessions{flex:1;overflow:auto;padding:0 10px 14px}
.card{padding:11px 12px;border-radius:12px;cursor:pointer;margin-bottom:2px;border:1px solid transparent}
.card:hover{background:var(--panel)}
.card.on{background:var(--panel);border-color:var(--line);box-shadow:var(--shadow)}
.card .t{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4;font-size:13.5px}
.card .m{color:var(--dim);font-size:11.5px;margin-top:4px}
.side-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px}

/* buttons */
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 13px;border-radius:9px;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:.12s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.sm{padding:5px 10px;font-size:12px}
.icon{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* main */
main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.jump{position:absolute;right:26px;bottom:128px;display:none;flex-direction:column;gap:8px;z-index:5}
.jump.on{display:flex}
.jump button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);display:grid;place-items:center;opacity:.85;transition:.12s}
.jump button:hover{border-color:var(--accent);color:var(--accent);opacity:1}
header{padding:18px 28px 0;background:var(--bg)}
.top{display:flex;align-items:flex-start;gap:12px 16px;flex-wrap:wrap}
.top h1{margin:0;font-size:19px;letter-spacing:-.3px;line-height:1.35;flex:1;min-width:240px;overflow-wrap:anywhere}
.top .sub{color:var(--dim);font-size:12px;margin-top:2px;font-weight:400}
.actions{display:flex;gap:8px;flex-shrink:0;align-items:center}
.switch{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--dim);cursor:pointer;user-select:none;margin-right:6px}
.switch input{display:none}
.switch i{width:30px;height:17px;border-radius:20px;background:var(--line);position:relative;transition:.15s}
.switch i:after{content:"";position:absolute;left:2px;top:2px;width:13px;height:13px;background:#fff;border-radius:50%;transition:.15s}
.switch input:checked+i{background:var(--accent)}.switch input:checked+i:after{left:15px}
.tabs{display:flex;gap:4px;margin-top:16px;border-bottom:1px solid var(--line)}
.tab{background:none;border:none;padding:9px 14px;color:var(--dim);font-weight:600;font-size:13.5px;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:7px;align-items:center}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}
.tab .n{background:var(--chip);color:var(--dim);border-radius:20px;padding:0 8px;font-size:11.5px;font-weight:600;line-height:19px}
.tab.on .n{background:var(--accent);color:#fff}
section{flex:1;min-height:0;display:none}
section.on{display:flex}

/* chat */
#chat{overflow:auto;flex-direction:column;align-items:center;padding:8px 28px 40px}
.col{width:100%;max-width:820px}
.msg{display:flex;gap:12px;margin:22px 0 0}
.msg.user{flex-direction:row-reverse}
.av{width:30px;height:30px;border-radius:10px;flex-shrink:0;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.msg.claude .av{background:linear-gradient(135deg,var(--accent),#e9a46f)}
.msg.user .av{background:#5b6270}
.body{max-width:calc(100% - 50px);min-width:0}
.msg.user .body{display:flex;flex-direction:column;align-items:flex-end}
.bubble{padding:11px 16px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65}
.msg.claude .bubble{background:var(--panel);border:1px solid var(--line);border-top-left-radius:5px;box-shadow:var(--shadow)}
.msg.user .bubble{background:var(--user);color:#fff;border-top-right-radius:5px}
.bubble+.bubble,.bubble+.chip,.chip+.bubble,.chip+.chip{margin-top:8px}
.ts{font-size:11px;color:var(--dim);margin-top:5px}
.bubble code{background:var(--code);padding:1px 6px;border-radius:5px;font:12.5px Consolas,monospace;color:inherit}
.msg.user .bubble code{background:rgba(255,255,255,.2)}
.bubble pre{background:var(--code);padding:12px 14px;border-radius:10px;overflow:auto;margin:8px 0 2px;font:12.5px/1.55 Consolas,monospace;white-space:pre;color:var(--text)}
.bubble pre code{background:none;padding:0}
.bubble b{font-weight:700}
.chip{background:var(--chip);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:12.5px;max-width:100%}
.chip>.h{display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;user-select:none}
.chip>.h:hover{background:var(--panel)}
.chip .nm{font-weight:700;font-family:Consolas,monospace;font-size:12px;color:var(--accent);flex-shrink:0}
.chip .sm{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chip .go{margin-left:auto;font-size:11px;color:var(--dim);flex-shrink:0;padding-left:8px}
.chip.err .nm{color:var(--err)}
.chip pre{margin:0;padding:12px 14px;background:var(--code);border-top:1px solid var(--line);overflow:auto;max-height:420px;font:12px/1.55 Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.chip.think{background:transparent;border-style:dashed}
.chip.think .nm{color:var(--dim);font-family:inherit}

/* composer */
.newrow{padding:0 16px 10px}.newrow .btn{width:100%;justify-content:center;padding:9px 13px}
.composer{padding:6px 28px 18px;background:var(--bg)}
.cbox{max-width:820px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:10px 12px 10px 14px;display:flex;flex-direction:column;gap:8px}
.cbox:focus-within{border-color:var(--accent)}
.cmode{display:flex;gap:4px}
.cmode button{border:1px solid var(--line);background:var(--chip);color:var(--dim);border-radius:20px;padding:2px 11px;font-size:11.5px;font-weight:600}
.cmode button:hover{color:var(--text)}
.cmode button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.cmode button.on[data-m="all"]{background:var(--err);border-color:var(--err)}
.crow{display:flex;gap:10px;align-items:flex-end}
.crow textarea{flex:1;border:none;outline:none;resize:none;background:transparent;color:var(--text);font:inherit;line-height:1.55;max-height:160px;padding:4px 0}
.crow textarea::placeholder{color:var(--dim)}
.crow .btn{flex-shrink:0}
.chint{max-width:820px;margin:6px auto 0;font-size:11.5px;color:var(--dim);padding:0 4px}
.bubble.typing{display:flex;gap:5px;align-items:center;padding:14px 18px}
.bubble.typing i{width:7px;height:7px;border-radius:50%;background:var(--dim);animation:blink 1.1s infinite both}
.bubble.typing i:nth-child(2){animation-delay:.18s}.bubble.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* modal / delete */
.modal{position:fixed;inset:0;background:rgba(15,17,21,.45);display:grid;place-items:center;z-index:20;padding:20px}
.modal[hidden]{display:none}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.3);padding:22px 24px 18px;max-width:440px;width:100%}
.mbox h3{margin:0 0 8px;font-size:16px}.mbox p{margin:0 0 16px;color:var(--dim);white-space:pre-line;overflow-wrap:anywhere;line-height:1.6}
.mact{display:flex;gap:8px;justify-content:flex-end}
.btn.danger{background:var(--err);border-color:var(--err);color:#fff}.btn.danger:hover{filter:brightness(1.08);color:#fff}
.card{position:relative}
.card .del{position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--dim);display:grid;place-items:center;opacity:0;transition:.12s;padding:0}
.card:hover .del{opacity:1}.card .del:hover{background:var(--chip);border-color:var(--line);color:var(--err)}
.card .t{padding-right:56px}
.card .ren{position:absolute;right:36px;top:8px;width:26px;height:26px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--dim);display:grid;place-items:center;opacity:0;transition:.12s;padding:0}
.card:hover .ren{opacity:1}.card .ren:hover{background:var(--chip);border-color:var(--line);color:var(--accent)}
.mbox input{width:100%;margin:0 0 16px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;outline:none}
.mbox input:focus{border-color:var(--accent)}


[hidden]{display:none!important}
/* 복사·붙여넣기 */
.bubble,.bubble *,.code,.code *,pre,#sub,#title,.ts,.col .empty{user-select:text;-webkit-user-select:text}
.bubble,.code,pre{cursor:text}
.chip>.h,.chip>.h *{user-select:none;-webkit-user-select:none}
.ts .cp{border:0;background:transparent;color:var(--accent);font:inherit;font-size:11px;cursor:pointer;padding:0 0 0 8px;opacity:0;transition:.12s}
.msg:hover .ts .cp,.ts .cp:focus-visible{opacity:1}
#ctx{position:fixed;z-index:40;min-width:150px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 36px rgba(0,0,0,.28);padding:5px}
#ctx[hidden]{display:none}
#ctx button{display:flex;width:100%;justify-content:space-between;gap:18px;border:0;background:transparent;color:var(--text);font:inherit;font-size:13px;padding:7px 10px;border-radius:8px;cursor:pointer;text-align:left}
#ctx button:hover:not(:disabled){background:var(--chip)}
#ctx button:disabled{color:var(--dim);opacity:.5;cursor:default}
#ctx kbd{color:var(--dim);font:11px inherit}
/* queue */
.msg.queued{opacity:.6}.msg.queued .bubble{border:1px dashed rgba(255,255,255,.55)}
.qtag{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--dim);margin-top:4px}
.qtag button{border:0;background:transparent;color:var(--accent);font:inherit;font-size:11px;cursor:pointer;padding:0;text-decoration:underline}
/* attach */
.cattach{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:11.5px;min-width:0}
.cattach span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbox.drop{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}

/* split panes */
.split{width:100%}
.list{width:46%;max-width:560px;min-width:320px;overflow:auto;border-right:1px solid var(--line);padding:10px 12px 20px}
.row{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:11px;cursor:pointer;border:1px solid transparent}
.row:hover{background:var(--panel)}
.row.on{background:var(--panel);border-color:var(--line);box-shadow:var(--shadow)}
.row .main{min-width:0;flex:1}
.row .a{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .b{font-size:11.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
.row .b.ltr{direction:ltr}
.badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;flex-shrink:0}
.b-생성{background:rgba(47,158,99,.15);color:var(--ok)}.b-수정{background:rgba(199,138,29,.16);color:var(--warn)}.b-읽기{background:var(--chip);color:var(--dim)}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:var(--dim)}
.dot.ok{background:var(--ok)}.dot.err{background:var(--err)}
.tag{font-size:11px;font-family:Consolas,monospace;background:var(--chip);color:var(--dim);padding:2px 8px;border-radius:7px;flex-shrink:0;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detail{flex:1;min-width:0;display:flex;flex-direction:column;padding:14px 22px 22px}
.dh{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.dh .p{font-weight:600;font-size:13px;overflow-wrap:anywhere;flex:1;min-width:200px}
.code{flex:1;overflow:auto;background:var(--code);border:1px solid var(--line);border-radius:12px;padding:14px 0;font:12.5px/1.6 Consolas,monospace}
.code div{padding:0 16px;white-space:pre-wrap;overflow-wrap:anywhere;min-height:1.6em}
.code .add{background:var(--add)}.code .del{background:var(--del)}.code .hunk{color:var(--accent)}
.empty{margin:auto;color:var(--dim);text-align:center;padding:40px}
.empty .big{font-size:38px;margin-bottom:8px;opacity:.6}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#222;color:#fff;padding:10px 18px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;max-width:80%;overflow-wrap:anywhere;z-index:9}
#toast.on{opacity:1;transform:translateX(-50%)}
.spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s .7s linear infinite;margin:30px auto}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<aside>
  <div class="brand"><div class="logo"><svg viewBox="0 0 24 24" width="17" height="17" fill="#fff"><path d="M5 4h14a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3h-6.5L8 21v-4H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3z"/><circle cx="8.2" cy="10.5" r="1.25" fill="#c8643c"/><circle cx="12" cy="10.5" r="1.25" fill="#c8643c"/><circle cx="15.8" cy="10.5" r="1.25" fill="#c8643c"/></svg></div>Claude Code 대화<span class="ver">v3.8</span></div>
  <div class="newrow"><button class="btn primary" id="bNew">＋ 새 대화</button></div>
  <div class="search">
    <svg viewBox="0 0 24 24" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" placeholder="대화 검색" autocomplete="off">
  </div>
  <div id="sessions"><div class="spin"></div></div>
  <div class="side-foot">
    <button class="btn sm" id="bTheme" title="다크 / 라이트 전환"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18" /><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
    <button class="btn sm" id="bRefresh"><svg class="icon" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>새로고침</button>
  </div>
</aside>
<main>
  <header>
    <div class="top">
      <h1 id="title">대화를 선택하세요<div class="sub" id="sub"></div></h1>
      <div class="actions">
        <label class="switch" title="system-reminder 블록을 대화에 포함"><input type="checkbox" id="rem"><i></i>시스템 알림</label>
        <button class="btn" id="bBrowser">브라우저로 보기</button>
        <button class="btn" id="bHtml">HTML 저장</button>
        <button class="btn primary" id="bTxt">TXT 저장</button>
      </div>
    </div>
    <div class="tabs" id="tabs">
      <button class="tab on" data-t="chat">대화<span class="n" id="n-chat">0</span></button>
      <button class="tab" data-t="files">파일<span class="n" id="n-files">0</span></button>
      <button class="tab" data-t="cmds">명령<span class="n" id="n-cmds">0</span></button>
      <button class="tab" data-t="others">기타<span class="n" id="n-others">0</span></button>
    </div>
  </header>
  <section id="chat" class="on"><div class="empty"><div class="big">💬</div>왼쪽에서 대화를 선택하면 내용이 여기에 표시됩니다</div></section>
  <section id="files" class="split"></section>
  <section id="cmds" class="split"></section>
  <section id="others" class="split"></section>
  <div class="composer" id="composer">
    <div class="cbox" id="cbox">
      <div class="cattach">
        <button class="btn sm" id="bAttach" title="Claude가 읽을 파일을 골라 경로를 입력창에 넣어요"><svg class="icon" viewBox="0 0 24 24"><path d="m21 11-9 9a5 5 0 0 1-7-7l9-9a3.5 3.5 0 0 1 5 5l-9 9a2 2 0 0 1-3-3l8-8"/></svg>파일 주소 넣기</button>
        <span>파일을 고르거나 이 칸에 끌어다 놓으면 경로가 입력창에 들어가요</span>
      </div>
      <div class="cmode" id="cmode" role="group" aria-label="허용 범위">
        <button data-m="read" class="on" title="파일 읽기·검색만 허용">읽기만</button>
        <button data-m="edit" title="파일 수정까지 허용">파일 수정</button>
        <button data-m="all" title="명령 실행까지 전부 허용 (주의)">모두 허용</button>
      </div>
      <div class="crow">
        <textarea id="msg" rows="1" placeholder="Claude에게 이어서 말하기…  (Enter 전송 · Shift+Enter 줄바꿈)"></textarea>
        <button class="btn primary" id="bSend">보내기</button>
        <button class="btn" id="bStop" hidden>중지</button>
      </div>
    </div>
    <div class="chint" id="chint"></div>
  </div>
  <div class="jump" id="jump">
    <button id="bTop" title="맨 위로"><svg class="icon" viewBox="0 0 24 24"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg></button>
    <button id="bBottom" title="맨 아래로"><svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg></button>
  </div>
</main>
<div class="modal" id="modal" hidden><div class="mbox" role="dialog" aria-modal="true">
  <h3 id="mT"></h3><p id="mB"></p><input id="mIn" hidden maxlength="80" autocomplete="off" spellcheck="false">
  <div class="mact"><button class="btn" id="mNo">취소</button><button class="btn primary" id="mYes">확인</button></div>
</div></div>
<div id="ctx" hidden></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let api, sessions=[], cur=null, data=null, sel={files:-1,cmds:-1,others:-1};
const api_=()=>window.pywebview.api;

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2600)}

// 간단 마크다운: ``` 코드블록, `인라인`, **굵게**
function md(s){
  return s.split(/```/).map((seg,i)=>{
    if(i%2){const nl=seg.indexOf('\n');return '<pre><code>'+esc(nl>=0&&nl<20?seg.slice(nl+1):seg)+'</code></pre>'}
    return esc(seg).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>')
  }).join('').replace(/<\/pre>\n/g,'</pre>');
}

/* ---- 세션 목록 ---- */
async function loadSessions(){
  $('#sessions').innerHTML='<div class="spin"></div>';
  sessions=await api_().list_sessions();
  renderSessions();
}
function renderSessions(){
  const q=$('#q').value.trim().toLowerCase();
  const list=sessions.map((s,i)=>[s,i]).filter(([s])=>!q||(s.title+s.project).toLowerCase().includes(q));
  $('#sessions').innerHTML=list.length?list.map(([s,i])=>
    `<div class="card${cur===s.path?' on':''}" data-i="${i}"><div class="t">${esc(s.title)}</div><div class="m">${esc(s.date)}</div><button class="ren" data-ren="${i}" title="이름 바꾸기"><svg class="icon" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button><button class="del" data-del="${i}" title="삭제(휴지통으로 이동)"><svg class="icon" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button></div>`).join('')
    :'<div class="empty">대화가 없습니다</div>';
}
$('#sessions').onclick=e=>{const d=e.target.closest('.del');if(d){e.stopPropagation();return delSession(+d.dataset.del)}
  const rn=e.target.closest('.ren');if(rn){e.stopPropagation();return renameSession(+rn.dataset.ren)}
  const c=e.target.closest('.card');if(!c)return;
  if(running||queue.length)return toast('응답 중이거나 예약된 메시지가 있으면 다른 대화로 바꿀 수 없어요');
  openSession(sessions[+c.dataset.i])};
$('#q').oninput=renderSessions;

let curInfo=null;
async function openSession(s){
  cur=s.path;curInfo=s;renderSessions();
  $('#chat').innerHTML='<div class="spin"></div>';
  data=await api_().open_session(s.path,s.title,$('#rem').checked);workDir=data.cwd;setHint();
  $('#title').firstChild.textContent=s.title;
  $('#sub').textContent=`${s.date} · 메시지 ${data.msgs.length}개`;
  sel={files:-1,cmds:-1,others:-1};
  renderChat();['files','cmds','others'].forEach(renderSplit);
  $('#n-chat').textContent=data.msgs.length;
  for(const k of ['files','cmds','others'])$('#n-'+k).textContent=data[k].length;
}
$('#rem').onchange=()=>{if(cur)openSession(curInfo)};

/* ---- 대화 ---- */
let renderDeferred=false;
function hasSelInChat(){const g=getSelection();return !!g&&!g.isCollapsed&&$('#chat').contains(g.anchorNode)}
document.addEventListener('selectionchange',()=>{if(renderDeferred&&!hasSelInChat()){renderDeferred=false;renderChat(true)}});
function renderChat(live){
  if(live&&data&&hasSelInChat()){renderDeferred=true;return}   // 선택 중이면 선택을 풀 때까지 미룬다
  renderDeferred=false;
  const el=$('#chat'),keep=el.scrollTop,atBottom=el.scrollHeight-el.scrollTop-el.clientHeight<90;
  let h='<div class="col">';
  for(const [mi,m] of data.msgs.entries()){
    const user=m.role==='user';
    let inner='';
    for(const p of m.parts){
      if(p.k==='text')inner+=`<div class="bubble">${md(p.t)}</div>`;
      else if(p.k==='thinking')inner+=`<div class="chip think"><div class="h"><span class="nm">생각</span><span class="sm">${esc(p.t.slice(0,80))}</span><span class="go">펼치기</span></div><pre hidden>${esc(p.t)}</pre></div>`;
      else inner+=`<div class="chip${p.err?' err':''}" data-cat="${p.cat}" data-idx="${p.idx}"><div class="h"><span class="nm">${esc(p.name)}</span><span class="sm">${esc(p.sum)}</span><span class="go">펼치기</span></div></div>`;
    }
    h+=`<div class="msg ${m.role}"><div class="av">${user?'나':'C'}</div><div class="body">${inner}<div class="ts">${esc(m.ts)}<button class="cp" data-cp="${mi}" title="이 메시지의 글 복사">복사</button></div></div></div>`;
  }
  if(pending&&!data.msgs.slice(-6).some(m=>m.role==='user'&&m.parts.some(p=>p.k==='text'&&p.t.trim()===pending)))
    h+=`<div class="msg user"><div class="av">나</div><div class="body"><div class="bubble">${md(pending)}</div></div></div>`;
  if(running)h+='<div class="msg claude"><div class="av">C</div><div class="body"><div class="bubble typing"><i></i><i></i><i></i></div></div></div>';
  queue.forEach((it,i)=>{h+=`<div class="msg user queued"><div class="av">나</div><div class="body"><div class="bubble">${md(it.text)}</div><div class="qtag">응답이 끝나면 보내요 <button data-q="${i}">취소</button></div></div></div>`});
  if(!data.msgs.length&&!pending&&!queue.length)h+='<div class="empty"><div class="big">💬</div>아래 입력창에 쓰면 Claude Code와 새 대화를 시작합니다</div>';
  el.innerHTML=h+'</div>';
  el.scrollTop=live?(atBottom?el.scrollHeight:keep):el.scrollHeight;   // 대화를 열면 가장 최근 메시지가 보이게(맨 아래)
}
$('#chat').onclick=async e=>{
  const h=e.target.closest('.chip>.h');if(!h)return;
  const chip=h.parentElement,go=h.querySelector('.go');
  let pre=chip.querySelector('pre');
  if(!pre){
    pre=document.createElement('pre');
    const d=await api_().detail(chip.dataset.cat,+chip.dataset.idx);
    pre.textContent=d.text;chip.appendChild(pre);go.textContent='접기';return;
  }
  pre.hidden=!pre.hidden;go.textContent=pre.hidden?'펼치기':'접기';
};

/* ---- 파일/명령/기타 ---- */
const split={
  files:{empty:'파일 작업 기록이 없습니다',row:(r)=>{
    const i=r.path.lastIndexOf('\\'),name=r.path.slice(i+1),dir=r.path.slice(0,i);
    return `<span class="badge b-${r.act}">${r.act}</span><div class="main"><div class="a">${esc(name)}</div><div class="b" title="${esc(r.path)}">${esc(dir)}&lrm;</div></div>`}},
  cmds:{empty:'실행한 명령이 없습니다',row:r=>
    `<span class="dot ${r.state}"></span><div class="main"><div class="a" style="font-family:Consolas,monospace;font-size:12px">${esc(r.cmd)||'(빈 명령)'}</div><div class="b ltr">${esc(r.ts)}</div></div><span class="tag">${esc(r.tool)}</span>`},
  others:{empty:'기록이 없습니다',row:r=>
    `<span class="tag" style="max-width:180px">${esc(r.tool.replace('mcp__',''))}</span><div class="main"><div class="a">${esc(r.sum)||'—'}</div><div class="b ltr">${esc(r.ts)}</div></div>`},
};
function renderSplit(k){
  const rows=data[k],el=$('#'+k);
  if(!rows.length){el.innerHTML=`<div class="empty"><div class="big">∅</div>${split[k].empty}</div>`;return}
  el.innerHTML=`<div class="list">${rows.map((r,i)=>`<div class="row" data-i="${i}">${split[k].row(r)}</div>`).join('')}</div>
  <div class="detail"><div class="empty"><div class="big">←</div>항목을 선택하면 상세 내용이 표시됩니다</div></div>`;
  el.querySelector('.list').onclick=e=>{const r=e.target.closest('.row');if(r)pick(k,+r.dataset.i)};
}
async function pick(k,i){
  sel[k]=i;
  const el=$('#'+k);
  el.querySelectorAll('.row').forEach(r=>r.classList.toggle('on',+r.dataset.i===i));
  const d=await api_().detail(k,i),r=data[k][i];
  let head=`<div class="dh"><div class="p">${esc(k==='files'?r.path:r.tool+' · '+(r.cmd||r.sum||''))}</div>`;
  if(k==='files')head+=`<button class="btn sm" id="bFolder"${r.exists?'':' disabled'}>폴더 열기</button><button class="btn sm" id="bFile"${r.exists?'':' disabled'}>현재 파일 열기</button>`;
  head+='</div>';
  const lines=d.text.split('\n').map(l=>{
    let c='';if(d.diff){if(l.startsWith('+')&&!l.startsWith('+++'))c='add';else if(l.startsWith('-')&&!l.startsWith('---'))c='del';else if(l.startsWith('@@'))c='hunk'}
    return `<div class="${c}">${esc(l)||' '}</div>`}).join('');
  el.querySelector('.detail').innerHTML=head+`<div class="code">${lines}</div>`;
  if(k==='files'){
    const f=async folder=>{if(!await api_().open_path(i,folder))toast('현재 이 경로에 파일이 없습니다')};
    $('#bFolder').onclick=()=>f(true);$('#bFile').onclick=()=>f(false);
  }
}

/* ---- 상단 ---- */
$('#tabs').onclick=e=>{const b=e.target.closest('.tab');if(!b)return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t===b));
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===b.dataset.t));
  $('#jump').classList.toggle('on',b.dataset.t==='chat');$('#composer').style.display=b.dataset.t==='chat'?'':'none'};
$('#jump').classList.add('on');
$('#bTop').onclick=()=>$('#chat').scrollTo({top:0,behavior:'smooth'});
$('#bBottom').onclick=()=>$('#chat').scrollTo({top:$('#chat').scrollHeight,behavior:'smooth'});
const need=fn=>async()=>{if(!data)return toast('대화를 먼저 선택하세요');fn()};
$('#bHtml').onclick=need(async()=>{const p=await api_().save('html');if(p)toast('저장됨: '+p)});
$('#bTxt').onclick=need(async()=>{const p=await api_().save('txt');if(p)toast('저장됨: '+p)});
$('#bBrowser').onclick=need(()=>api_().view_browser());
$('#bRefresh').onclick=loadSessions;
/* 파일을 창 어디에 놓아도 경로가 입력창에 들어간다 (실제 경로는 파이썬 쪽 drop 핸들러가 dropOpen으로 전달) */
window.addEventListener('dragover',e=>{e.preventDefault();cb.classList.add('drop')});
window.addEventListener('dragleave',e=>{if(!e.relatedTarget)cb.classList.remove('drop')});
window.addEventListener('drop',e=>{e.preventDefault();cb.classList.remove('drop')});
function dropOpen(paths){cb.classList.remove('drop');insertPaths(typeof paths==='string'?[paths]:paths)}
$('#bTheme').onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).getPropertyValue('--bg').trim()==='#0f1115';
  r.dataset.theme=d?'light':'dark'};

/* ---- 입력창: 설치된 Claude Code로 이어서 말하기 ---- */
let queue=[],userStopped=false,ticking=false;
let running=false,pending=null,pollTimer=null,lastVer=null,claudeOk=false,curMode='read',workDir=null,newCwd=null;
const MODE_HINT={read:'파일 읽기·검색만 허용합니다. 수정이나 명령 실행은 거절돼요.',edit:'파일 수정까지 허용합니다. 명령 실행은 거절돼요.',all:'⚠ 모든 도구를 확인 없이 실행합니다. 내 PC 파일을 바꿀 수 있어요.'};
function setHint(){
  if(!claudeOk){$('#chint').textContent='Claude Code가 설치돼 있어야 사용할 수 있어요. 설치하고 로그인한 뒤 뷰어를 다시 열어 주세요.';return}
  const where=cur?workDir:newCwd;
  if(running){$('#chint').textContent='응답 중이에요. 지금 쓰는 메시지는 응답이 끝나면 자동으로 이어서 보내요 · 중지하면 입력창으로 돌아와요';$('#chint').style.cursor='';return}
  $('#chint').textContent=(where?'📁 '+where:!cur?'📁 기본 폴더(내 사용자 폴더) · 눌러서 바꾸기':'')+(where||!cur?'  ·  ':'')+MODE_HINT[curMode];
  $('#chint').style.cursor=cur?'':'pointer';
}
$('#chint').onclick=async()=>{if(cur||running)return;const d=await api_().pick_folder();if(d){newCwd=d;setHint()}};
/* 확인창(웹뷰 기본 confirm 대신 자체 창: PC마다 동작이 달라지지 않게) */
function ask(title,body,yes='확인',danger=false){return new Promise(res=>{
  $('#mT').textContent=title;$('#mB').textContent=body;
  const y=$('#mYes'),n=$('#mNo');y.textContent=yes;y.className='btn '+(danger?'danger':'primary');
  $('#modal').hidden=false;y.focus();
  const done=v=>{$('#modal').hidden=true;y.onclick=n.onclick=null;document.removeEventListener('keydown',key,true);res(v)};
  const key=e=>{if(e.key==='Escape'){e.preventDefault();done(false)}};
  document.addEventListener('keydown',key,true);y.onclick=()=>done(true);n.onclick=()=>done(false)})}
async function ensureConsent(){
  if(await api_().get_setting('consent'))return true;
  const ok=await ask('이 PC에 접속해도 될까요?','Claude Code가 이 PC의 파일을 읽을 수 있게 됩니다.\n입력한 말과 Claude가 읽은 파일 내용은 Anthropic으로 전송돼요.\n\n처음에는 "읽기만" 모드라서 파일을 바꾸거나 명령을 실행하지 못해요. 입력창 위의 버튼으로 범위를 바꿀 수 있습니다.','허용');
  if(ok)await api_().set_setting('consent',true);return ok}
function setRunning(v){running=v;$('#bStop').hidden=!v;$('#bSend').textContent=v?'다음에 보내기':'보내기';$('#msg').disabled=!claudeOk;$('#bSend').disabled=!claudeOk;if(!v&&claudeOk)$('#msg').focus();setHint()}
function autosize(){const t=$('#msg');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,160)+'px'}
function counts(){$('#n-chat').textContent=data.msgs.length;for(const k of ['files','cmds','others'])$('#n-'+k).textContent=data[k].length}
async function refresh(){
  if(!cur||!curInfo)return;
  data=await api_().open_session(cur,curInfo.title,$('#rem').checked);workDir=data.cwd;
  $('#sub').textContent=`${curInfo.date||''} · 메시지 ${data.msgs.length}개`.replace(/^ · /,'');
  renderChat(true);counts();
}
async function tick(){
  if(ticking)return;ticking=true;
  try{
    const p=await api_().poll();
    if(p.path&&!cur){cur=p.path;curInfo={path:p.path,title:'새 대화',date:''}}
    if(p.path&&cur===p.path&&p.ver&&(!lastVer||p.ver[0]!==lastVer[0]||p.ver[1]!==lastVer[1])){lastVer=p.ver;await refresh()}
    if(p.running)return;
    clearInterval(pollTimer);running=false;pending=null;setRunning(false);
    if(cur===p.path||(!cur&&p.path)){await refresh();['files','cmds','others'].forEach(renderSplit)}
    await loadSessions();const s=sessions.find(x=>x.path===cur);if(s){curInfo=s;$('#title').firstChild.textContent=s.title}
    setHint();if(p.error)toast('오류: '+p.error);
    // 대기열: 정상 종료면 다음 메시지를 자동으로 보내고, 중지했거나 오류면 입력창으로 되돌려 잃어버리지 않게 한다
    if(queue.length){
      if(p.error||userStopped)restoreQueue(userStopped?'중지해서 예약한 메시지를 입력창으로 돌려놨어요':'오류가 나서 예약한 메시지를 입력창으로 돌려놨어요');
      else{const it=queue.shift();if(!await dispatch(it.text,it.files)){queue.unshift(it);restoreQueue('예약한 메시지를 보내지 못해 입력창으로 돌려놨어요')}}
    }
    userStopped=false;
  }finally{ticking=false}
}
function restoreQueue(msg){
  const t=$('#msg'),back=queue.map(i=>i.text).join('\n\n');queue=[];
  t.value=t.value?back+'\n\n'+t.value:back;autosize();renderChat(true);toast(msg)}
/* ---- 파일 주소 넣기: 고르거나 끌어다 놓은 파일의 경로를 입력창에 넣는다 ---- */
let attachPaths=new Set();
const q=p=>/\s/.test(p)?'"'+p+'"':p;           // 공백이 있으면 따옴표로 감싼다
function insertPaths(paths){
  if(!paths||!paths.length)return;
  const t=$('#msg'),a=t.selectionStart??t.value.length,b=t.selectionEnd??a,pre=t.value.slice(0,a),post=t.value.slice(b);
  const add=paths.map(q).join(' ')+' ';
  t.value=pre+(pre&&!/\s$/.test(pre)?' ':'')+add+post;
  const pos=(pre+(pre&&!/\s$/.test(pre)?' ':'')+add).length;t.setSelectionRange(pos,pos);
  paths.forEach(p=>attachPaths.add(p));
  autosize();t.focus();
}
$('#bAttach').onclick=async()=>insertPaths(await api_().pick_files());
const cb=$('#cbox');
/* 실제 전송 (새 대화/이어 말하기 공통). 성공하면 true */
async function dispatch(t,files){
  const r=await api_().send(t,curMode,files);if(!r.ok){toast(r.error);return false}
  pending=t;lastVer=null;
  if(!data)data={msgs:[],files:[],cmds:[],others:[]};
  setRunning(true);renderChat(true);
  $('#chat').scrollTop=$('#chat').scrollHeight;
  clearInterval(pollTimer);pollTimer=setInterval(tick,700);
  return true}
async function send(){
  const t=$('#msg').value.trim();if(!t||!claudeOk)return;
  const files=[...attachPaths].filter(p=>t.includes(p));
  if(!await ensureConsent())return;
  if(running){                          // 응답 중: 예약해 두었다가 끝나면 자동 전송
    queue.push({text:t,files});$('#msg').value='';attachPaths=new Set();autosize();
    renderChat(true);$('#chat').scrollTop=$('#chat').scrollHeight;return}
  if(cur){const st=await api_().session_state(cur),mine=data&&data.ver&&st.ver&&data.ver[0]===st.ver[0]&&data.ver[1]===st.ver[1];
    if(!mine&&st.idle!==null&&st.idle<20&&!await ask('다른 곳에서 쓰는 중일 수 있어요','이 대화가 방금까지 터미널 등 다른 곳에서 쓰인 것 같아요.\n같은 대화에 동시에 보내면 기록이 꼬일 수 있습니다.','그래도 보내기'))return}
  if(await dispatch(t,files)){$('#msg').value='';attachPaths=new Set();autosize()}
}
$('#bSend').onclick=send;
$('#bStop').onclick=()=>{userStopped=true;api_().stop()};
$('#chat').addEventListener('click',e=>{const b=e.target.closest('button[data-q]');if(!b)return;   // 예약 취소: 입력창으로 되돌림
  const [it]=queue.splice(+b.dataset.q,1);if(!it)return;const t=$('#msg');t.value=t.value?it.text+'\n\n'+t.value:it.text;autosize();renderChat(true);t.focus()});
$('#msg').oninput=autosize;
$('#msg').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}};
$('#cmode').onclick=async e=>{const b=e.target.closest('button');if(!b||b.dataset.m===curMode)return;const m=b.dataset.m;
  if(m==='edit'&&!await ask('파일 수정을 허용할까요?','Claude가 이 대화의 폴더 안에서 파일을 만들거나 고칠 수 있게 됩니다.\n명령 실행은 계속 거절돼요.','허용'))return;
  if(m==='all'&&!await ask('모든 도구를 허용할까요?','Claude가 확인 없이 파일을 바꾸고 명령을 실행할 수 있습니다.\n내 PC에 영향을 줄 수 있으니 믿을 수 있는 폴더에서만 쓰세요.','모두 허용',true))return;
  curMode=m;document.querySelectorAll('#cmode button').forEach(x=>x.classList.toggle('on',x===b));setHint()};
function resetToNew(){
  cur=null;curInfo=null;pending=null;queue=[];newCwd=null;workDir=null;
  data={msgs:[],files:[],cmds:[],others:[]};
  $('#title').firstChild.textContent='새 대화';$('#sub').textContent='';
  sel={files:-1,cmds:-1,others:-1};renderSessions();renderChat(false);['files','cmds','others'].forEach(renderSplit);counts();setHint()}
$('#bNew').onclick=async()=>{
  if(running||queue.length)return toast('응답 중이거나 예약된 메시지가 있으면 새 대화를 시작할 수 없어요');
  await api_().new_chat();resetToNew();
  document.querySelector('.tab[data-t="chat"]').click();$('#msg').focus()};
/* 이름 바꾸기: 입력칸이 있는 확인창. 확인하면 새 이름(문자열), 취소하면 null */
function askText(title,body,value){return new Promise(res=>{
  $('#mT').textContent=title;$('#mB').textContent=body;
  const y=$('#mYes'),n=$('#mNo'),inp=$('#mIn');y.textContent='저장';y.className='btn primary';
  inp.hidden=false;inp.value=value;$('#modal').hidden=false;inp.focus();inp.select();
  const done=v=>{$('#modal').hidden=true;inp.hidden=true;y.onclick=n.onclick=inp.onkeydown=null;res(v)};
  inp.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();done(inp.value)}else if(e.key==='Escape'){e.preventDefault();done(null)}};
  y.onclick=()=>done(inp.value);n.onclick=()=>done(null)})}
async function renameSession(i){
  const s=sessions[i];if(!s)return;
  const v=await askText('대화 이름 바꾸기','뷰어에서만 바뀌어요. 비워서 저장하면 원래 이름으로 돌아갑니다.',s.title);
  if(v===null||v.trim()===s.title)return;
  const r=await api_().rename_session(s.path,v);if(!r.ok)return toast(r.error);
  if(cur===s.path)$('#title').firstChild.textContent=r.title;
  await loadSessions();if(cur===s.path)curInfo=sessions.find(x=>x.path===cur)||curInfo;
  toast('이름을 바꿨어요')}
async function delSession(i){
  const s=sessions[i];if(!s)return;
  if(running&&s.path===cur)return toast('응답 중인 대화는 삭제할 수 없어요');
  if(!await ask('이 대화를 삭제할까요?',`"${s.title}"\n\n휴지통으로 옮겨요. 휴지통에서 복원할 수 있습니다.`,'삭제',true))return;
  const r=await api_().delete_session(s.path);if(!r.ok)return toast(r.error);
  if(cur===s.path){await api_().new_chat();resetToNew()}
  await loadSessions();toast('휴지통으로 옮겼어요')}

/* ---- 우클릭 메뉴: 웹뷰 기본 메뉴는 꺼져 있어서 직접 만든다 ---- */
const isEdit=el=>el&&(el.tagName==='TEXTAREA'||(el.tagName==='INPUT'&&/^(text|search|)$/.test(el.type)));
async function copyText(t){
  if(!t)return false;
  let ok=false;try{ok=await api_().set_clipboard(t)}catch(e){}
  if(!ok){try{await navigator.clipboard.writeText(t);ok=true}catch(e){}}
  return ok}
function selText(el){return isEdit(el)?el.value.slice(el.selectionStart,el.selectionEnd):String(getSelection())}
function fire(el){el.dispatchEvent(new Event('input',{bubbles:true}))}
async function pasteInto(el){
  const t=await api_().get_clipboard();if(!t)return toast('붙여넣을 글이 없어요');
  const a=el.selectionStart,b=el.selectionEnd;el.focus();el.setRangeText(t,a,b,'end');fire(el)}
function ctxMenu(x,y,items){
  const m=$('#ctx');m.innerHTML=items.map((it,i)=>`<button data-i="${i}"${it.off?' disabled':''}>${it.label}<kbd>${it.key||''}</kbd></button>`).join('');
  m.hidden=false;m.style.left=m.style.top='0px';
  const w=m.offsetWidth,h=m.offsetHeight;m.style.left=Math.max(4,Math.min(x,innerWidth-w-4))+'px';m.style.top=Math.max(4,Math.min(y,innerHeight-h-4))+'px';
  m.onmousedown=e=>e.preventDefault();                      // 메뉴를 눌러도 입력창의 선택이 풀리지 않게
  m.onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;m.hidden=true;items[+b.dataset.i].run()}}
const hideCtx=()=>{$('#ctx').hidden=true};
document.addEventListener('contextmenu',e=>{
  e.preventDefault();const t=e.target,ed=isEdit(t)?t:null;
  if(ed){
    const has=ed.selectionStart!==ed.selectionEnd,ro=ed.disabled||ed.readOnly;
    ed.focus();
    return ctxMenu(e.clientX,e.clientY,[
      {label:'잘라내기',key:'Ctrl+X',off:!has||ro,run:async()=>{if(await copyText(selText(ed))){ed.setRangeText('',ed.selectionStart,ed.selectionEnd,'end');fire(ed)}}},
      {label:'복사',key:'Ctrl+C',off:!has,run:async()=>{if(await copyText(selText(ed)))toast('복사했어요')}},
      {label:'붙여넣기',key:'Ctrl+V',off:ro,run:()=>pasteInto(ed)},
      {label:'전체 선택',key:'Ctrl+A',run:()=>{ed.focus();ed.select()}}])}
  const has=!!String(getSelection());
  ctxMenu(e.clientX,e.clientY,[
    {label:'복사',key:'Ctrl+C',off:!has,run:async()=>{if(await copyText(selText(null)))toast('복사했어요')}},
    {label:'전체 선택',key:'Ctrl+A',run:()=>{const r=document.createRange(),g=getSelection(),n=t.closest&&t.closest('.bubble,pre,.code')||$('#chat');r.selectNodeContents(n);g.removeAllRanges();g.addRange(r)}}])});
addEventListener('mousedown',e=>{if(!e.target.closest('#ctx'))hideCtx()},true);
addEventListener('keydown',e=>{if(e.key==='Escape')hideCtx()});
addEventListener('blur',hideCtx);$('#chat').addEventListener('scroll',hideCtx);
/* 메시지 복사 버튼: 도구 칩은 빼고 글만 모아서 복사 */
$('#chat').addEventListener('click',async e=>{
  const b=e.target.closest('button[data-cp]');if(!b||!data)return;
  const m=data.msgs[+b.dataset.cp];if(!m)return;
  const t=m.parts.filter(p=>p.k==='text').map(p=>p.t).join('\n\n').trim();
  toast(await copyText(t)?'메시지를 복사했어요':'복사하지 못했어요')});

window.addEventListener('pywebviewready',async()=>{
  claudeOk=await api_().claude_available();setHint();setRunning(false);
  const init=await api_().get_initial();
  await loadSessions();
  if(init)openSession(init);
});
</script>
