<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Claude Code 대화 뷰어</title>
<style>
:root{
  --bg:#f6f5f2;--panel:#ffffff;--side:#efede8;--line:#e3e0d9;--text:#1f1d1a;--dim:#7a766d;
  --accent:#c8643c;--accent-ink:#fff;--user:#c8643c;--chip:#f1efe9;--code:#f4f2ed;
  --ok:#2f9e63;--err:#d44a4a;--warn:#c78a1d;--add:#e3f5e8;--del:#fbe6e6;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1115;--panel:#171a20;--side:#13161b;--line:#262a33;--text:#e8e6e1;--dim:#8b8f99;
  --accent:#e0805a;--chip:#1e222a;--code:#11141a;--add:#12301f;--del:#3a1a1c;--shadow:0 1px 2px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --bg:#0f1115;--panel:#171a20;--side:#13161b;--line:#262a33;--text:#e8e6e1;--dim:#8b8f99;
  --accent:#e0805a;--chip:#1e222a;--code:#11141a;--add:#12301f;--del:#3a1a1c;--shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.6 "Segoe UI Variable Text","Segoe UI","Malgun Gothic",sans-serif;display:flex;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--dim);background-clip:padding-box;border:2px solid transparent}

/* sidebar */
aside{width:316px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0}
.brand{padding:20px 20px 12px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:-.2px}
.logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#e9a46f);display:grid;place-items:center;color:#fff;font-size:14px}
.search{margin:0 16px 10px;position:relative}
.search input{width:100%;padding:9px 12px 9px 34px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;outline:none}
.search input:focus{border-color:var(--accent)}
.search svg{position:absolute;left:11px;top:11px;width:15px;height:15px;stroke:var(--dim);fill:none;stroke-width:2}
#sessions{flex:1;overflow:auto;padding:0 10px 14px}
.card{padding:11px 12px;border-radius:12px;cursor:pointer;margin-bottom:2px;border:1px solid transparent}
.card:hover{background:var(--panel)}
.card.on{background:var(--panel);border-color:var(--line);box-shadow:var(--shadow)}
.card .t{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4;font-size:13.5px}
.card .m{color:var(--dim);font-size:11.5px;margin-top:4px}
.side-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px}

/* buttons */
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 13px;border-radius:9px;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:.12s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.sm{padding:5px 10px;font-size:12px}
.icon{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* main */
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{padding:18px 28px 0;background:var(--bg)}
.top{display:flex;align-items:flex-start;gap:12px 16px;flex-wrap:wrap}
.top h1{margin:0;font-size:19px;letter-spacing:-.3px;line-height:1.35;flex:1;min-width:240px;overflow-wrap:anywhere}
.top .sub{color:var(--dim);font-size:12px;margin-top:2px;font-weight:400}
.actions{display:flex;gap:8px;flex-shrink:0;align-items:center}
.switch{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--dim);cursor:pointer;user-select:none;margin-right:6px}
.switch input{display:none}
.switch i{width:30px;height:17px;border-radius:20px;background:var(--line);position:relative;transition:.15s}
.switch i:after{content:"";position:absolute;left:2px;top:2px;width:13px;height:13px;background:#fff;border-radius:50%;transition:.15s}
.switch input:checked+i{background:var(--accent)}.switch input:checked+i:after{left:15px}
.tabs{display:flex;gap:4px;margin-top:16px;border-bottom:1px solid var(--line)}
.tab{background:none;border:none;padding:9px 14px;color:var(--dim);font-weight:600;font-size:13.5px;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:7px;align-items:center}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}
.tab .n{background:var(--chip);color:var(--dim);border-radius:20px;padding:0 8px;font-size:11.5px;font-weight:600;line-height:19px}
.tab.on .n{background:var(--accent);color:#fff}
section{flex:1;min-height:0;display:none}
section.on{display:flex}

/* chat */
#chat{overflow:auto;flex-direction:column;align-items:center;padding:8px 28px 40px}
.col{width:100%;max-width:820px}
.msg{display:flex;gap:12px;margin:22px 0 0}
.msg.user{flex-direction:row-reverse}
.av{width:30px;height:30px;border-radius:10px;flex-shrink:0;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.msg.claude .av{background:linear-gradient(135deg,var(--accent),#e9a46f)}
.msg.user .av{background:#5b6270}
.body{max-width:calc(100% - 50px);min-width:0}
.msg.user .body{display:flex;flex-direction:column;align-items:flex-end}
.bubble{padding:11px 16px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65}
.msg.claude .bubble{background:var(--panel);border:1px solid var(--line);border-top-left-radius:5px;box-shadow:var(--shadow)}
.msg.user .bubble{background:var(--user);color:#fff;border-top-right-radius:5px}
.bubble+.bubble,.bubble+.chip,.chip+.bubble,.chip+.chip{margin-top:8px}
.ts{font-size:11px;color:var(--dim);margin-top:5px}
.bubble code{background:var(--code);padding:1px 6px;border-radius:5px;font:12.5px Consolas,monospace;color:inherit}
.msg.user .bubble code{background:rgba(255,255,255,.2)}
.bubble pre{background:var(--code);padding:12px 14px;border-radius:10px;overflow:auto;margin:8px 0 2px;font:12.5px/1.55 Consolas,monospace;white-space:pre;color:var(--text)}
.bubble pre code{background:none;padding:0}
.bubble b{font-weight:700}
.chip{background:var(--chip);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:12.5px;max-width:100%}
.chip>.h{display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;user-select:none}
.chip>.h:hover{background:var(--panel)}
.chip .nm{font-weight:700;font-family:Consolas,monospace;font-size:12px;color:var(--accent);flex-shrink:0}
.chip .sm{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chip .go{margin-left:auto;font-size:11px;color:var(--dim);flex-shrink:0;padding-left:8px}
.chip.err .nm{color:var(--err)}
.chip pre{margin:0;padding:12px 14px;background:var(--code);border-top:1px solid var(--line);overflow:auto;max-height:420px;font:12px/1.55 Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.chip.think{background:transparent;border-style:dashed}
.chip.think .nm{color:var(--dim);font-family:inherit}

/* split panes */
.split{width:100%}
.list{width:46%;max-width:560px;min-width:320px;overflow:auto;border-right:1px solid var(--line);padding:10px 12px 20px}
.row{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:11px;cursor:pointer;border:1px solid transparent}
.row:hover{background:var(--panel)}
.row.on{background:var(--panel);border-color:var(--line);box-shadow:var(--shadow)}
.row .main{min-width:0;flex:1}
.row .a{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .b{font-size:11.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
.row .b.ltr{direction:ltr}
.badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;flex-shrink:0}
.b-생성{background:rgba(47,158,99,.15);color:var(--ok)}.b-수정{background:rgba(199,138,29,.16);color:var(--warn)}.b-읽기{background:var(--chip);color:var(--dim)}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:var(--dim)}
.dot.ok{background:var(--ok)}.dot.err{background:var(--err)}
.tag{font-size:11px;font-family:Consolas,monospace;background:var(--chip);color:var(--dim);padding:2px 8px;border-radius:7px;flex-shrink:0;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detail{flex:1;min-width:0;display:flex;flex-direction:column;padding:14px 22px 22px}
.dh{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.dh .p{font-weight:600;font-size:13px;overflow-wrap:anywhere;flex:1;min-width:200px}
.code{flex:1;overflow:auto;background:var(--code);border:1px solid var(--line);border-radius:12px;padding:14px 0;font:12.5px/1.6 Consolas,monospace}
.code div{padding:0 16px;white-space:pre-wrap;overflow-wrap:anywhere;min-height:1.6em}
.code .add{background:var(--add)}.code .del{background:var(--del)}.code .hunk{color:var(--accent)}
.empty{margin:auto;color:var(--dim);text-align:center;padding:40px}
.empty .big{font-size:38px;margin-bottom:8px;opacity:.6}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#222;color:#fff;padding:10px 18px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;max-width:80%;overflow-wrap:anywhere;z-index:9}
#toast.on{opacity:1;transform:translateX(-50%)}
.spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s .7s linear infinite;margin:30px auto}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<aside>
  <div class="brand"><div class="logo">✦</div>Claude Code 대화</div>
  <div class="search">
    <svg viewBox="0 0 24 24" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" placeholder="대화 검색" autocomplete="off">
  </div>
  <div id="sessions"><div class="spin"></div></div>
  <div class="side-foot">
    <button class="btn sm" id="bOpen"><svg class="icon" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>파일 열기</button>
    <button class="btn sm" id="bRefresh"><svg class="icon" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>새로고침</button>
    <button class="btn sm" id="bTheme" title="테마 전환" style="margin-left:auto">◐</button>
  </div>
</aside>
<main>
  <header>
    <div class="top">
      <h1 id="title">대화를 선택하세요<div class="sub" id="sub"></div></h1>
      <div class="actions">
        <label class="switch" title="system-reminder 블록을 대화에 포함"><input type="checkbox" id="rem"><i></i>시스템 알림</label>
        <button class="btn" id="bBrowser">브라우저로 보기</button>
        <button class="btn" id="bHtml">HTML 저장</button>
        <button class="btn primary" id="bTxt">TXT 저장</button>
      </div>
    </div>
    <div class="tabs" id="tabs">
      <button class="tab on" data-t="chat">대화<span class="n" id="n-chat">0</span></button>
      <button class="tab" data-t="files">파일<span class="n" id="n-files">0</span></button>
      <button class="tab" data-t="cmds">명령<span class="n" id="n-cmds">0</span></button>
      <button class="tab" data-t="others">기타<span class="n" id="n-others">0</span></button>
    </div>
  </header>
  <section id="chat" class="on"><div class="empty"><div class="big">💬</div>왼쪽에서 대화를 선택하면 내용이 여기에 표시됩니다</div></section>
  <section id="files" class="split"></section>
  <section id="cmds" class="split"></section>
  <section id="others" class="split"></section>
</main>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let api, sessions=[], cur=null, data=null, sel={files:-1,cmds:-1,others:-1};
const api_=()=>window.pywebview.api;

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2600)}

// 간단 마크다운: ``` 코드블록, `인라인`, **굵게**
function md(s){
  return s.split(/```/).map((seg,i)=>{
    if(i%2){const nl=seg.indexOf('\n');return '<pre><code>'+esc(nl>=0&&nl<20?seg.slice(nl+1):seg)+'</code></pre>'}
    return esc(seg).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>')
  }).join('').replace(/<\/pre>\n/g,'</pre>');
}

/* ---- 세션 목록 ---- */
async function loadSessions(){
  $('#sessions').innerHTML='<div class="spin"></div>';
  sessions=await api_().list_sessions();
  renderSessions();
}
function renderSessions(){
  const q=$('#q').value.trim().toLowerCase();
  const list=sessions.map((s,i)=>[s,i]).filter(([s])=>!q||(s.title+s.project).toLowerCase().includes(q));
  $('#sessions').innerHTML=list.length?list.map(([s,i])=>
    `<div class="card${cur===s.path?' on':''}" data-i="${i}"><div class="t">${esc(s.title)}</div><div class="m">${esc(s.date)}</div></div>`).join('')
    :'<div class="empty">대화가 없습니다</div>';
}
$('#sessions').onclick=e=>{const c=e.target.closest('.card');if(c)openSession(sessions[+c.dataset.i])};
$('#q').oninput=renderSessions;

let curInfo=null;
async function openSession(s){
  cur=s.path;curInfo=s;renderSessions();
  $('#chat').innerHTML='<div class="spin"></div>';
  data=await api_().open_session(s.path,s.title,$('#rem').checked);
  $('#title').firstChild.textContent=s.title;
  $('#sub').textContent=`${s.date} · 메시지 ${data.msgs.length}개`;
  sel={files:-1,cmds:-1,others:-1};
  renderChat();['files','cmds','others'].forEach(renderSplit);
  $('#n-chat').textContent=data.msgs.length;
  for(const k of ['files','cmds','others'])$('#n-'+k).textContent=data[k].length;
}
$('#rem').onchange=()=>{if(cur)openSession(curInfo)};

/* ---- 대화 ---- */
function renderChat(){
  let h='<div class="col">';
  for(const m of data.msgs){
    const user=m.role==='user';
    let inner='';
    for(const p of m.parts){
      if(p.k==='text')inner+=`<div class="bubble">${md(p.t)}</div>`;
      else if(p.k==='thinking')inner+=`<div class="chip think"><div class="h"><span class="nm">생각</span><span class="sm">${esc(p.t.slice(0,80))}</span><span class="go">펼치기</span></div><pre hidden>${esc(p.t)}</pre></div>`;
      else inner+=`<div class="chip${p.err?' err':''}" data-cat="${p.cat}" data-idx="${p.idx}"><div class="h"><span class="nm">${esc(p.name)}</span><span class="sm">${esc(p.sum)}</span><span class="go">펼치기</span></div></div>`;
    }
    h+=`<div class="msg ${m.role}"><div class="av">${user?'나':'C'}</div><div class="body">${inner}<div class="ts">${esc(m.ts)}</div></div></div>`;
  }
  $('#chat').innerHTML=h+'</div>';
  $('#chat').scrollTop=0;
}
$('#chat').onclick=async e=>{
  const h=e.target.closest('.chip>.h');if(!h)return;
  const chip=h.parentElement,go=h.querySelector('.go');
  let pre=chip.querySelector('pre');
  if(!pre){
    pre=document.createElement('pre');
    const d=await api_().detail(chip.dataset.cat,+chip.dataset.idx);
    pre.textContent=d.text;chip.appendChild(pre);go.textContent='접기';return;
  }
  pre.hidden=!pre.hidden;go.textContent=pre.hidden?'펼치기':'접기';
};

/* ---- 파일/명령/기타 ---- */
const split={
  files:{empty:'파일 작업 기록이 없습니다',row:(r)=>{
    const i=r.path.lastIndexOf('\\'),name=r.path.slice(i+1),dir=r.path.slice(0,i);
    return `<span class="badge b-${r.act}">${r.act}</span><div class="main"><div class="a">${esc(name)}</div><div class="b" title="${esc(r.path)}">${esc(dir)}&lrm;</div></div>`}},
  cmds:{empty:'실행한 명령이 없습니다',row:r=>
    `<span class="dot ${r.state}"></span><div class="main"><div class="a" style="font-family:Consolas,monospace;font-size:12px">${esc(r.cmd)||'(빈 명령)'}</div><div class="b ltr">${esc(r.ts)}</div></div><span class="tag">${esc(r.tool)}</span>`},
  others:{empty:'기록이 없습니다',row:r=>
    `<span class="tag" style="max-width:180px">${esc(r.tool.replace('mcp__',''))}</span><div class="main"><div class="a">${esc(r.sum)||'—'}</div><div class="b ltr">${esc(r.ts)}</div></div>`},
};
function renderSplit(k){
  const rows=data[k],el=$('#'+k);
  if(!rows.length){el.innerHTML=`<div class="empty"><div class="big">∅</div>${split[k].empty}</div>`;return}
  el.innerHTML=`<div class="list">${rows.map((r,i)=>`<div class="row" data-i="${i}">${split[k].row(r)}</div>`).join('')}</div>
  <div class="detail"><div class="empty"><div class="big">←</div>항목을 선택하면 상세 내용이 표시됩니다</div></div>`;
  el.querySelector('.list').onclick=e=>{const r=e.target.closest('.row');if(r)pick(k,+r.dataset.i)};
}
async function pick(k,i){
  sel[k]=i;
  const el=$('#'+k);
  el.querySelectorAll('.row').forEach(r=>r.classList.toggle('on',+r.dataset.i===i));
  const d=await api_().detail(k,i),r=data[k][i];
  let head=`<div class="dh"><div class="p">${esc(k==='files'?r.path:r.tool+' · '+(r.cmd||r.sum||''))}</div>`;
  if(k==='files')head+=`<button class="btn sm" id="bFolder"${r.exists?'':' disabled'}>폴더 열기</button><button class="btn sm" id="bFile"${r.exists?'':' disabled'}>현재 파일 열기</button>`;
  head+='</div>';
  const lines=d.text.split('\n').map(l=>{
    let c='';if(d.diff){if(l.startsWith('+')&&!l.startsWith('+++'))c='add';else if(l.startsWith('-')&&!l.startsWith('---'))c='del';else if(l.startsWith('@@'))c='hunk'}
    return `<div class="${c}">${esc(l)||' '}</div>`}).join('');
  el.querySelector('.detail').innerHTML=head+`<div class="code">${lines}</div>`;
  if(k==='files'){
    const f=async folder=>{if(!await api_().open_path(i,folder))toast('현재 이 경로에 파일이 없습니다')};
    $('#bFolder').onclick=()=>f(true);$('#bFile').onclick=()=>f(false);
  }
}

/* ---- 상단 ---- */
$('#tabs').onclick=e=>{const b=e.target.closest('.tab');if(!b)return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t===b));
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===b.dataset.t))};
const need=fn=>async()=>{if(!data)return toast('대화를 먼저 선택하세요');fn()};
$('#bHtml').onclick=need(async()=>{const p=await api_().save('html');if(p)toast('저장됨: '+p)});
$('#bTxt').onclick=need(async()=>{const p=await api_().save('txt');if(p)toast('저장됨: '+p)});
$('#bBrowser').onclick=need(()=>api_().view_browser());
$('#bRefresh').onclick=loadSessions;
$('#bOpen').onclick=async()=>{const s=await api_().pick_file();if(s)openSession(s)};
$('#bTheme').onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).getPropertyValue('--bg').trim()==='#0f1115';
  r.dataset.theme=d?'light':'dark'};

window.addEventListener('pywebviewready',async()=>{
  const init=await api_().get_initial();
  await loadSessions();
  if(init)openSession(init);
});
</script>
</body>
</html>
